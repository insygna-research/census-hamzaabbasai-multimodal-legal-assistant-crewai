description: |
  Multimodal legal contract review system for risk detection, source evidence and human approval, built with Python, CrewAI, Mistral OCR, FastAPI, Qdrant and Next.js. Legal and procurement teams can spend many hours reading long contracts. They also need to connect each risk to the correct clause and page. Multimodal Legal Assistant makes the first review faster. It reads digital PDFs, scanned contracts, images, text, and Markdown. It finds contract risks, shows the source evidence, and waits for a human decision. This application supports legal review. It does not provide legal advice. Primary language: python; ships a container definition; observed outbound integrations: api.mistral.ai.
