[project]
name = "multimodal-legal-assistant-crewai"
version = "0.1.0"
description = "CrewAI contract risk and compliance review with Mistral OCR"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm]>=1.15,<1.16",
    "fastapi>=0.116,<1",
    "mistralai>=1.10,<2",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.15,<1.16",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
